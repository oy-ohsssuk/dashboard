<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>통합장바구니 FE 티켓 대시보드</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --card-hover: #334155;
        --border: #334155;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --done: #22c55e;
        --todo: #f59e0b;
        --wontdo: #ef4444;
        --inprogress: #3b82f6;
        --hold: #a855f7;
        --ma-color: #818cf8;
        --oh-color: #38bdf8;
        --radius: 12px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        padding: 24px;
        min-height: 100vh;
      }
      .header {
        text-align: center;
        margin-bottom: 32px;
        padding: 32px;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      .header h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        background: linear-gradient(135deg, var(--accent), var(--ma-color));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .header .subtitle {
        color: var(--text-muted);
        font-size: 14px;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }
      .summary-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        text-align: center;
        border: 1px solid var(--border);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .summary-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      .summary-card .number {
        font-size: 32px;
        font-weight: 800;
        display: block;
        margin-bottom: 4px;
      }
      .summary-card .label {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .charts-section {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 24px;
        margin-bottom: 32px;
      }
      .chart-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 24px;
        border: 1px solid var(--border);
      }
      .chart-card h3 {
        font-size: 16px;
        margin-bottom: 20px;
      }
      .donut-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }
      .donut-wrapper {
        position: relative;
        width: 160px;
        height: 160px;
      }
      .donut-wrapper canvas {
        width: 160px !important;
        height: 160px !important;
      }
      .donut-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      .donut-center .pct {
        font-size: 28px;
        font-weight: 800;
      }
      .donut-center .pct-label {
        font-size: 11px;
        color: var(--text-muted);
      }
      .legend {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .bar-chart {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .bar-label {
        width: 60px;
        font-size: 13px;
        font-weight: 600;
        text-align: right;
        flex-shrink: 0;
      }
      .bar-track {
        flex: 1;
        height: 32px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
      }
      .bar-fill {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        transition: width 1s ease;
        min-width: 0;
      }
      .bar-fill.done {
        background: var(--done);
      }
      .bar-fill.inprogress {
        background: var(--inprogress);
      }
      .bar-fill.todo {
        background: var(--todo);
      }
      .bar-fill.hold {
        background: var(--hold);
      }
      .bar-fill.wontdo {
        background: var(--wontdo);
      }
      .bar-count {
        width: 40px;
        font-size: 13px;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      .progress-section {
        margin-bottom: 32px;
      }
      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .progress-header h3 {
        font-size: 16px;
      }
      .progress-header .pct-text {
        font-size: 14px;
        color: var(--accent);
        font-weight: 700;
      }
      .progress-bar-outer {
        width: 100%;
        height: 12px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 6px;
        overflow: hidden;
      }
      .progress-bar-inner {
        height: 100%;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--done), var(--accent));
        transition: width 1.5s ease;
      }
      .filter-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .filter-btn {
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s;
      }
      .filter-btn:hover {
        background: var(--card-hover);
      }
      .filter-btn.active {
        background: var(--accent);
        color: #0f172a;
        border-color: var(--accent);
        font-weight: 700;
      }
      .table-card {
        background: var(--card);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        overflow: hidden;
        margin-bottom: 32px;
      }
      .table-card h3 {
        padding: 20px 24px 16px;
        font-size: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead th {
        background: rgba(255, 255, 255, 0.03);
        padding: 12px 16px;
        text-align: left;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      thead th:hover {
        color: var(--accent);
      }
      tbody tr {
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        transition: background 0.15s;
      }
      tbody tr:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      tbody td {
        padding: 12px 16px;
        font-size: 13px;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
      }
      .status-badge.done {
        background: rgba(34, 197, 94, 0.15);
        color: var(--done);
      }
      .status-badge.inprogress {
        background: rgba(59, 130, 246, 0.15);
        color: var(--inprogress);
      }
      .status-badge.todo {
        background: rgba(245, 158, 11, 0.15);
        color: var(--todo);
      }
      .status-badge.hold {
        background: rgba(168, 85, 247, 0.15);
        color: var(--hold);
      }
      .status-badge.wontdo {
        background: rgba(239, 68, 68, 0.15);
        color: var(--wontdo);
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .status-dot.done {
        background: var(--done);
      }
      .status-dot.inprogress {
        background: var(--inprogress);
      }
      .status-dot.todo {
        background: var(--todo);
      }
      .status-dot.hold {
        background: var(--hold);
      }
      .status-dot.wontdo {
        background: var(--wontdo);
      }
      .assignee-tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
      }
      .assignee-tag.ma {
        background: rgba(129, 140, 248, 0.15);
        color: var(--ma-color);
      }
      .assignee-tag.oh {
        background: rgba(56, 189, 248, 0.15);
        color: var(--oh-color);
      }
      .assignee-tag.both {
        background: rgba(168, 85, 247, 0.15);
        color: var(--hold);
      }
      .assignee-tag.none {
        background: rgba(148, 163, 184, 0.15);
        color: var(--text-muted);
      }
      .issue-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
      }
      .issue-link:hover {
        text-decoration: underline;
      }
      .md-cell {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .footer {
        text-align: center;
        padding: 24px;
        color: var(--text-muted);
        font-size: 12px;
      }
      .md-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }
      .md-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        border: 1px solid var(--border);
      }
      .md-card h4 {
        font-size: 14px;
        margin-bottom: 12px;
        color: var(--text-muted);
      }
      .md-card .md-total {
        font-size: 28px;
        font-weight: 800;
      }
      .md-card .md-detail {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 4px;
      }
      @media (max-width: 768px) {
        body {
          padding: 12px;
        }
        .summary-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .charts-section {
          grid-template-columns: 1fr;
        }
        .donut-container {
          flex-direction: column;
        }
        table {
          font-size: 12px;
        }
        tbody td,
        thead th {
          padding: 8px 10px;
        }
      }
    </style>
  </head>

      function drawDonut(canvasId, segments, total) {
        var canvas = document.getElementById(canvasId);
        var ctx = canvas.getContext("2d");
        var dpr = window.devicePixelRatio || 1;
        canvas.width = 160 * dpr;
        canvas.height = 160 * dpr;
        ctx.scale(dpr, dpr);
        var cx = 80,
          cy = 80,
          outerR = 70,
          innerR = 48,
          startAngle = -Math.PI / 2;
        for (var i = 0; i < segments.length; i++) {
          var seg = segments[i];
          if (seg.value === 0) continue;
          var sliceAngle = (seg.value / total) * 2 * Math.PI;
          ctx.beginPath();
          ctx.arc(cx, cy, outerR, startAngle, startAngle + sliceAngle);
          ctx.arc(cx, cy, innerR, startAngle + sliceAngle, startAngle, true);
          ctx.closePath();
          ctx.fillStyle = seg.color;
          ctx.fill();
          startAngle += sliceAngle;
        }
      }
      function buildDonut(canvasId, pctId, legendId, counts, total, pctVal) {
        document.getElementById(pctId).textContent = pctVal + "%";

              '"></div>' +
              s +
              " (" +
              counts[s] +
              ")</div>";
          }
        });
        document.getElementById(legendId).innerHTML = lh;
        drawDonut(canvasId, segs, total);

          filtered = issues.filter(function (i) {

        var h = "";
        for (var idx = 0; idx < filtered.length; idx++) {
          var issue = filtered[idx];

                : issue.assignee === "마성민/오준석"

      var sortDir = {};

        document.getElementById("overallProgress").style.width = donePct + "%";
      }, 100);
    </script>
